name = "greencollar-api"
main = "src/index.ts"
compatibility_date = "2026-10-12"

[[d1_databases]]
binding = "DB"
database_name = "greencollar-db"
database_id = "2c168587-dbe5-41f2-ac57-bbe762842ea2"
migrations_dir = "migrations"

# Public Clerk development JWT verification metadata. No secret keys.
[vars]
OIDC_ISSUER = "https://close-chipmunk-6010.clerk.accounts.dev"
OIDC_AUDIENCE = "greencollar-api"
OIDC_JWKS_URL = "https://close-chipmunk-6010.clerk.accounts.dev/.well-known/jwks.json"

# Isolated staging binding. Public access stays disabled until a staging route is selected.
[env.staging]
name = "greencollar-api-staging"
workers_dev = false

[[env.staging.d1_databases]]
binding = "DB"
database_name = "greencollar-staging"
database_id = "8e427f86-efc4-4a1c-a92c-1d2f57093bf8"
migrations_dir = "migrations"
migrations_table = "d1_migrations"

[env.staging.vars]
OIDC_ISSUER = "https://close-chipmunk-6010.clerk.accounts.dev"
OIDC_AUDIENCE = "greencollar-api"
OIDC_JWKS_URL = "https://close-chipmunk-6010.clerk.accounts.dev/.well-known/jwks.json"
